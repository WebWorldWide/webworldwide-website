name: web-world-wide

# Images are pinned to tested digests (tag@sha256) so a rebuild can never
# silently pick up a different upstream image. scripts/check-image-updates.sh
# (monthly) alerts when a newer image is published for a tag; to update, run
# `docker pull <tag>`, test, and replace the digest here.

services:
  # 1. Cloudflare Tunnel (Inbound traffic without port forwarding)
  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # Cloudflared routes to Caddy (tunnel ingress: http://caddy:80) over the
    # dedicated `edge` network — it can reach nothing else in the stack.
    networks: [edge]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

  # (1b. The docker-socket-proxy was removed in 2026-11. Even GET-only it
  # exposed every host container's environment — tunnel token, DB passwords —
  # and filesystem to anything on the network. The CMS dashboard now reads
  # container status from docker/health/containers.json, written by the host's
  # system-health cron.)

  # 2. Caddy Reverse Proxy (Internal routing to services)
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: caddy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    healthcheck:
      # The catch-all :80 block answers any Host header with a plain 200, so
      # this proves Caddy itself is up and serving without depending on any
      # particular upstream (cms/remark42/umami) also being healthy.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # Bind to loopback only. The Cloudflare tunnel reaches Caddy as `caddy:80`
      # over the docker network (see docker/cloudflare-tunnel-routes.md), so the
      # host port is needed ONLY for local `curl 127.0.0.1` checks. Publishing on
      # 0.0.0.0 let a LAN host hit Caddy directly with a spoofed CF-Connecting-IP
      # / X-Forwarded-For and bypass the cms rate limiter; loopback closes that.
      - "127.0.0.1:80:80"
    environment:
      - DOMAIN_ADMIN=${DOMAIN_ADMIN}
      - DOMAIN_COMMENTS=${DOMAIN_COMMENTS}
      - DOMAIN_ANALYTICS=${DOMAIN_ANALYTICS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Host-local extra sites (e.g. homelab routes reached via the host's own
      # cloudflared on 127.0.0.1:80). Git-ignored; see caddy-sites.d/README.md.
      - ./caddy-sites.d:/etc/caddy/sites.d:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app, immich-edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

  # 3. Web World Wide CMS (Node.js Admin Panel)
  cms:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    container_name: cms
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 2
    healthcheck:
      # No curl/wget in this image (see admin/Dockerfile) — Node itself is
      # always present, so use it directly rather than adding a package.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/auth/status',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Run as the host owner of the mounted site/ + .git (adam, uid 1000)
    # so container writes don't litter the repo with root-owned files and
    # git needs no safe.directory escape hatch.
    user: "1000:1000"
    depends_on:
      - languagetool
    networks: [app, lt]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${CMS_SESSION_SECRET}
      - RP_ID=${DOMAIN_ADMIN}
      - ORIGIN=https://${DOMAIN_ADMIN}
      - SITE_DIR=/app/site
      - TE_HEALTH_DIR=/app/health
      - TE_STATE_DIR=/app/health
      # Git push auth — the repo's credential helper (.git/config, which
      # is bind-mounted below) reads this. The token never appears in a
      # remote URL.
      - GH_TOKEN=${GH_TOKEN}
      # Commit identity (replaces the root-only `git config --global`
      # that used to live in the Dockerfile).
      - GIT_AUTHOR_NAME=Web World Wide CMS
      - GIT_AUTHOR_EMAIL=cms@webworldwide.online
      - GIT_COMMITTER_NAME=Web World Wide CMS
      - GIT_COMMITTER_EMAIL=cms@webworldwide.online
      # Remark42 ingestion for the admin Comments view — without these
      # the poller silently skips and moderation shows nothing.
      - REMARK42_URL=${REMARK42_INTERNAL_URL:-http://remark42:8080}
      - REMARK42_SITE_ID=${REMARK42_SITE_ID:-webworldwide}
      # Admin credentials for moderation writes (pin/delete/spam/reply).
      - REMARK42_SECRET=${REMARK42_SECRET}
      - REMARK42_ADMIN_PASSWD=${REMARK42_ADMIN_PASSWD:-}
      - REMARK42_ADMIN_ID=${REMARK42_ADMIN_ID:-}
      - COMMENTS_ORIGIN=https://${DOMAIN_COMMENTS}
      - SITE_ORIGIN=https://${SITE_DOMAIN:-webworldwide.online}
      # Auth policy. Password sign-in turns off once a passkey exists; set
      # ALLOW_PASSWORD_LOGIN=1 only as a temporary break-glass. SETUP_TOKEN is
      # required for first-run account creation in production.
      - ALLOW_PASSWORD_LOGIN=${ALLOW_PASSWORD_LOGIN:-}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Umami proxy for the admin Analytics view (server-side only).
      - UMAMI_API_URL=${UMAMI_INTERNAL_URL:-http://umami:3000}
      - UMAMI_ADMIN_USER=${UMAMI_ADMIN_USER:-}
      - UMAMI_ADMIN_PASSWORD=${UMAMI_ADMIN_PASSWORD:-}
      - UMAMI_SITE_ID=${UMAMI_SITE_ID:-}
      # LanguageTool (editor spell + grammar). Same-origin /api/proofread
      # proxies here; the browser never talks to it directly.
      - LANGUAGETOOL_URL=${LANGUAGETOOL_URL:-http://languagetool:8010/v2}
      # Bluesky auto-cross-post (POSSE). Values come from docker/.env (0600,
      # git-ignored). BLUESKY_APP_PASSWORD must be an APP password
      # (bsky.app/settings/app-passwords), NOT the account password. Empty =
      # feature stays off (isConfigured() requires both handle + app password).
      - BLUESKY_HANDLE=${BLUESKY_HANDLE:-}
      - BLUESKY_APP_PASSWORD=${BLUESKY_APP_PASSWORD:-}
      - BLUESKY_SERVICE=${BLUESKY_SERVICE:-https://bsky.social}
      # Mastodon direct cross-post. Configure in the admin UI (Settings →
      # Syndication) OR here. MASTODON_ACCESS_TOKEN needs the write:statuses
      # scope. Empty = off (isConfigured() requires both instance + token).
      - MASTODON_INSTANCE=${MASTODON_INSTANCE:-}
      - MASTODON_ACCESS_TOKEN=${MASTODON_ACCESS_TOKEN:-}
    volumes:
      - ../site:/app/site          # So it can read/write site files
      - ../.git:/app/.git          # So it can commit/push
      # …but never rewrite the host's git config or hooks: host cron runs git
      # in this checkout as adam (docker group ≈ root), so a writable
      # core.sshCommand / hook would be a container→host escape.
      - ../.git/config:/app/.git/config:ro
      - ../.git/hooks:/app/.git/hooks:ro
      - cms_data:/app/data         # SQLite DB for auth
      - /sys/class/thermal:/sys/class/thermal:ro     # Host thermal sensors
      - ./health:/app/health:ro                      # SD/system-health marker (scripts/system-health.sh)

  # 3b. LanguageTool — spell + grammar engine for the post editor.
  # Internal only (no published port, no tunnel/Caddy route); reachable as
  # http://languagetool:8010 on the compose network. No n-gram model (that
  # data is multi-GB), keeping the footprint near 0.5 GB heap.
  # The /api/proofread route degrades gracefully while this is starting/down.
  languagetool:
    image: erikvl87/languagetool:latest@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    container_name: languagetool
    restart: unless-stopped
    expose:
      - "8010"
    # Hard cap so the JVM (512m heap + ~256m overhead) cannot balloon alongside
    # cms/postgres/umami. If it exceeds this Docker
    # kills it and restart:unless-stopped brings it back.
    mem_limit: 768m
    cpus: 1
    networks: [lt]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    environment:
      - Java_Xms=256m
      - Java_Xmx=512m
      - langtool_cacheSize=1000

  # 4. Remark42 (Comments)
  remark42:
    image: umputun/remark42:latest@sha256:aa61f7d97e0a2cbadf07ed06e0f3384c6b6f8ab5b8782f052eff56a3a72cd98e
    container_name: remark42
    restart: unless-stopped
    environment:
      - REMARK_URL=https://${DOMAIN_COMMENTS}
      - SECRET=${REMARK42_SECRET}
      - SITE=webworldwide
      - AUTH_ANON=true             # No login required for users
      - ADMIN_SHARED_ID=${REMARK42_ADMIN_ID}
      # Spam posture for an anonymous-friendly board: cap comment size,
      # allow short self-edits, auto-close threads on old posts, and let
      # community votes bury/hide obvious junk.
      - MAX_COMMENT_SIZE=4096
      - EDIT_TIME=5m
      - READONLY_AGE=90
      - LOW_SCORE=-3
      - CRITICAL_SCORE=-7
      # Only Caddy (on the app network) may set forwarding headers — otherwise
      # any client can spoof its IP past rate limits and vote dedup.
      - TRUSTED_PROXY=172.30.2.0/24
      # Only our site may embed the widget (CSP frame-ancestors).
      - ALLOWED_HOSTS='self',https://${SITE_DOMAIN:-webworldwide.online}
      # Anonymous commenters can upload images: keep them small.
      - IMAGE_MAX_SIZE=500000
      # Basic-auth admin used by the CMS moderation view (empty = disabled).
      - ADMIN_PASSWD=${REMARK42_ADMIN_PASSWD:-}
    volumes:
      - remark_data:/srv/var
    networks: [app]
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

  # 5. Umami (Analytics)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    container_name: umami
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      - APP_SECRET=${UMAMI_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, db]
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

  # 6. PostgreSQL (for Umami)
  postgres:
    image: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [db]
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

# Segmented networks: each service reaches only what it needs. `internal`
# networks have no route out of the host.
networks:
  edge: # cloudflared ↔ caddy
    ipam:
      config: [{ subnet: 172.30.1.0/24 }]
  app: # caddy ↔ cms / remark42 / umami (needs egress: GitHub, Bluesky, …)
    ipam:
      config: [{ subnet: 172.30.2.0/24 }]
  db: # umami ↔ postgres
    internal: true
    ipam:
      config: [{ subnet: 172.30.3.0/24 }]
  lt: # cms ↔ languagetool
    internal: true
    ipam:
      config: [{ subnet: 172.30.4.0/24 }]
  immich-edge: # caddy ↔ immich_server (separate stack; joins as external)
    name: wwwide-immich-edge
    ipam:
      config: [{ subnet: 172.30.5.0/24 }]

volumes:
  caddy_data:
  caddy_config:
  cms_data:
  remark_data:
  pg_data:
