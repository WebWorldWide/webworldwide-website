<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — Web World Wide // Admin</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <!-- WebAuthn library — defer so it doesn't block the login form's
         first paint. The passkey CTA is interactive within ~50ms of
         first render either way; defer is purely a latency win. -->
    <script defer src="/vendor/simplewebauthn-browser.umd.min.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">Skip to content</a>

    <main class="auth-card" id="main" tabindex="-1">
      <div class="auth-brand">
        <span class="tmark s48" aria-hidden="true"></span>
        <span class="name">
          Web World <b>Wide</b>
          <span>Admin</span>
        </span>
      </div>

      <!-- Setup panel (first-time only) -->
      <section class="auth-panel" id="setup-panel" aria-labelledby="setup-title">
        <h1 class="auth-title" id="setup-title">Create admin account</h1>
        <p class="auth-sub">First-time setup</p>

        <form id="setup-form" novalidate>
          <div class="field">
            <label for="setup-user">Username</label>
            <input type="text" id="setup-user" autocomplete="username" required minlength="2" />
          </div>
          <div class="field">
            <label for="setup-pass">
              Password
              <span style="text-transform: none; color: var(--ink-soft)">(min 8 chars)</span>
            </label>
            <div class="pw-wrap">
              <input
                type="password"
                id="setup-pass"
                autocomplete="new-password"
                required
                minlength="8"
              />
              <button
                type="button"
                class="pw-toggle"
                data-target="setup-pass"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary submit">Create account</button>
        </form>

        <p class="auth-foot">
          After creating your account you can register a passkey from the dashboard.
        </p>
      </section>

      <!-- Login panel (returning user) -->
      <section class="auth-panel" id="login-panel" aria-labelledby="login-title">
        <h1 class="auth-title" id="login-title">Sign in</h1>
        <p class="auth-sub">Web World Wide CMS</p>

        <button type="button" class="btn btn-primary auth-passkey" id="btn-passkey-login">
          <span class="ico" aria-hidden="true" data-icon="passkey"></span>Use passkey
        </button>

        <div class="auth-divider"><span>or</span></div>

        <button
          type="button"
          class="auth-toggle"
          id="toggle-password-form"
          aria-expanded="false"
          aria-controls="login-form"
        >
          Sign in with password
        </button>

        <form class="auth-form" id="login-form" novalidate>
          <div class="field">
            <label for="login-user">Username</label>
            <input type="text" id="login-user" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-pass">Password</label>
            <div class="pw-wrap">
              <input type="password" id="login-pass" autocomplete="current-password" required />
              <button
                type="button"
                class="pw-toggle"
                data-target="login-pass"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary submit">Sign in</button>
        </form>

        <div class="auth-error" id="auth-error" role="alert"></div>
      </section>
    </main>

    <div id="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>

    <script src="/js/a11y.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
