# Weekly, grouped dependency updates. Minor/patch groups (and security fixes)
# are merged automatically once every check passes
# (.github/workflows/dependabot-automerge.yml); majors wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/site', '/admin']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 6
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
