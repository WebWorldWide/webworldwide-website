# Weekly, grouped dependency updates, fully hands-off: every update is
# merged automatically once all checks pass and then deployed, and one whose
# checks keep failing is closed (.github/workflows/dependabot-automerge.yml).
# Routine major versions are ignored everywhere; a security fix that needs
# a major still arrives and is merged if the full test suite passes.
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/site', '/admin']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 6
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /docker
    # Image majors (e.g. Postgres 15 -> 18) need a data migration; never automatic.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /admin
    # Node majors are a deliberate LTS decision (CI pins the same version),
    # not a weekly bump.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
