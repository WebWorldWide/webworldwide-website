# Weekly, grouped dependency updates. Minor/patch groups (and security fixes)
# are merged automatically once every check passes
# (.github/workflows/dependabot-automerge.yml); majors wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/site', '/admin']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 6
    groups:
      # Toolchains whose packages must move together (a lone major fails
      # peer-dependency resolution until its plugins catch up).
      typescript:
        patterns: [typescript, typescript-eslint, '@typescript-eslint/*', ts-api-utils]
        update-types: [major]
      vitest:
        patterns: [vitest, '@vitest/*']
        update-types: [major]
      stylelint:
        patterns: ['stylelint*']
        update-types: [major]
      eslint:
        patterns: [eslint, '@eslint/*', 'eslint-plugin-*', 'eslint-config-*', globals]
        update-types: [major]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /admin
    # Node majors are a deliberate LTS decision (CI pins the same version),
    # not a weekly bump.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
