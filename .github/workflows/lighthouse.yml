name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build and the static Lighthouse test need site/ deps (Astro,
      # Sharp, and @iarna/toml in prebuild.mjs).
      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      # Build the production output once; the Lighthouse test audits site/dist.
      - name: Build the Astro site
        working-directory: site
        env:
          NODE_ENV: production
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse mobile budgets
        env:
          LHCI: 'true'
        run: npx playwright test test/playwright/lighthouse.spec.ts --project=chromium

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 14
