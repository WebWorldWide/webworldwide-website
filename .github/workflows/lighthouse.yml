name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both the build below and lhci's preview need site/ deps (Astro, Sharp,
      # and @iarna/toml in prebuild.mjs).
      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      # Build once here so lhci's startServerCommand only has to `preview` the
      # prebuilt dist/. Building inside startServerCommand raced lhci's
      # server-ready timeout (Sharp image processing is slow on the runner).
      - name: Build the Astro site
        working-directory: site
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run Lighthouse CI
        env:
          # astro/Vite emit ANSI colour codes between "Local" and the URL, which
          # broke lhci's startServerReadyPattern; NO_COLOR keeps the ready line
          # (and the rest of the log) plain.
          NO_COLOR: '1'
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: npx lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
