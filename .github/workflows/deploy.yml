name: Deploy Astro site to GitHub Pages

# Quality gates run on every push/PR via quality.yml, e2e.yml, and lighthouse.yml.
# Enforce a passing build on this branch before deploy by configuring
# GitHub branch protection: Settings → Branches → Protect "main" → require
# status checks "Quality / *", "E2E + a11y / playwright", "Lighthouse / lhci"
# to pass before merge. This workflow then trusts that anything on main is green.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      # site/package.json's build script runs:
      #   1. node scripts/prebuild.mjs   — generates legacy-redirects.json
      #                                    and substitutes __SITE_HOST__ in
      #                                    public/.well-known/webfinger.
      #   2. astro check                  — typecheck pass.
      #   3. astro build                  — emits site/dist/.
      - name: Build with Astro
        working-directory: site
        env:
          NODE_ENV: production
          TZ: America/Chicago
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/dist
          # The artifact tar excludes every dot-path (--exclude=.[^/]*) unless this
          # is set, which silently dropped dist/.well-known — so /.well-known/webfinger
          # 404'd and Mastodon/Threads couldn't resolve the @domain@domain handle.
          include-hidden-files: true

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
