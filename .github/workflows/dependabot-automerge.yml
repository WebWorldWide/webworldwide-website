name: Dependabot auto-merge

# Hands-off dependency updates. Runs after each Dependabot PR's CI workflows
# finish (workflow_run), in the base repo's context — it never checks out or
# runs the PR's code.
#
# - All checks green → merge and deploy.
#   npm majors only arrive as security fixes (dependabot.yml ignores them as
#   routine updates), and the full test suite has just passed them, so they
#   merge too. Docker image majors (e.g. a Postgres data-format change) are
#   never merged here: CI doesn't exercise the images, so those PRs are
#   closed instead.
# - A check failed → re-run the failed jobs once (CI mirrors flake); if it
#   fails again, close the PR. Dependabot offers the next release later.
# Nothing is ever left open waiting for a person.
on:
  workflow_run:
    workflows: ['Quality', 'E2E + a11y', 'Lighthouse']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge once every check is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number,author -q '.[] | select(.author.login == "app/dependabot") | .number' | head -1)
          if [ -z "$pr" ]; then echo "No open Dependabot PR for $BRANCH"; exit 0; fi

          title=$(gh pr view "$pr" -R "$REPO" --json title -q .title)
          # "bump X from 1.2.3 to 2.0.0": a change in the leading number (or
          # in the minor of a 0.x version) is a breaking bump.
          major=false
          if [[ "$title" =~ from\ v?([0-9]+)\.([0-9]+)[^\ ]*\ to\ v?([0-9]+)\.([0-9]+) ]]; then
            fm=${BASH_REMATCH[1]} fn=${BASH_REMATCH[2]} tm=${BASH_REMATCH[3]} tn=${BASH_REMATCH[4]}
            if [ "$fm" != "$tm" ] || { [ "$fm" = 0 ] && [ "$fn" != "$tn" ]; }; then major=true; fi
          fi
          if $major && [[ "$BRANCH" == dependabot/docker* ]]; then
            gh pr close "$pr" -R "$REPO" --delete-branch --comment \
              "Closed automatically: a major container-image update can change its data format, and CI doesn't test the images. It stays on the current major."
            exit 0
          fi

          checks=$(gh pr checks "$pr" -R "$REPO" --json name,bucket)
          if ! jq -e 'length > 0 and all(.bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null; then
            echo "Checks not all green yet:"; jq -r '.[] | "  \(.bucket)  \(.name)"' <<<"$checks"; exit 0
          fi

          gh pr merge "$pr" -R "$REPO" --merge --delete-branch
          # Merges made with GITHUB_TOKEN don't fire push workflows, so
          # start the Pages deploy explicitly.
          gh workflow run deploy.yml -R "$REPO" --ref main

  failed:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry once, then close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number,author -q '.[] | select(.author.login == "app/dependabot") | .number' | head -1)
          if [ -z "$pr" ]; then echo "No open Dependabot PR for $BRANCH"; exit 0; fi
          if [ "$ATTEMPT" -lt 2 ]; then
            echo "$WORKFLOW failed on attempt $ATTEMPT — re-running its failed jobs once."
            gh run rerun "$RUN_ID" -R "$REPO" --failed
            exit 0
          fi
          gh pr close "$pr" -R "$REPO" --delete-branch --comment \
            "Closed automatically: **$WORKFLOW** failed twice on this update, so it would have broken the site. Dependabot will offer a later release."
