# Web World Wide — user-editable site parameters
#
# This file is read by both `astro.config.mjs` (at build time) and the admin
# CMS's settings route (at runtime). It exists so user-facing config — analytics
# URLs, social handles, tagline, author — can change without touching the Astro
# build config. The admin's TOML round-trip test asserts this stays parseable.

[site]
url = "https://webworldwide.online"
title = "Web World Wide"
description = "My World on the Web"
tagline = "My World on the Web"
author = "the operator"
copyright = "Web World Wide"
locale = "en-US"
default_language = "en"

[blog]
posts_per_page = 6
permalink = "/blog/:slug/"
masthead_name = "Web World Wide"
masthead_kicker = "Blog"

[social]
youtube = "https://www.youtube.com/@web_world_wide"
youtube_handle = "@web_world_wide"
github = "https://github.com/WebWorldWide"
twitter = "https://x.com/mywebworldwide"
bluesky = "https://bsky.app/profile/web-world-wide.bsky.social"
mastodon = "https://mastodon.social/@webworldwide"
reddit = "https://www.reddit.com/user/web_world_wide"
instagram = "https://www.instagram.com/mywebworldwide"
threads = "https://www.threads.net/@mywebworldwide"

[comments]
# Remark42 self-hosted commenting (deployed alongside the admin Pi via Docker).
# Anonymous posting is enabled server-side (AUTH_ANON=true) so no account is
# needed to comment. `url_dev` points at the local dev Remark42 container.
provider = "remark42"
url = "https://comments.webworldwide.online"
url_dev = "http://localhost:8081"
site_id = "webworldwide"

[analytics]
# Umami self-hosted privacy-friendly analytics
provider = "umami"
url = "https://analytics.webworldwide.online"
site_id = "680f36bd-688c-4816-b764-685860911396"

[rss]
url = "/rss.xml"

[fediverse]
# Bridgy Fed bridges this site to Mastodon / Threads / the fediverse. Using the
# DOMAIN as the username matches Bridgy Fed's "web" convention, so the handle
# followers use is `webworldwide.online@<site.url host>` (i.e.
# @webworldwide.online@webworldwide.online). A mismatched subject makes Mastodon
# reject the webfinger.
enabled = true
handle_user = "webworldwide.online"

[apps]
# Linked products on the home page Apps section.
# Kept for backward compat while the Astro components migrate to
# [homepage.apps] below — do not remove until that migration lands.
fileid = "https://claude.ai/design/p/51500a82-3faf-4144-9a89-94e738dbb888?file=index.html"
doc_finder = ""  # Empty = renders as "SOON" tile

[homepage]
# Home-page editor (admin CMS). Section visibility + ordering for the
# landing page. Edited via PATCH /api/settings/homepage.
section_order = ["hero", "apps", "videos", "socials", "blog_cta"]

[homepage.sections]
hero = true
apps = true
videos = true
socials = true
blog_cta = true

[homepage.hero]
# `tagline` renders under the wordmark; "·"/"•" separators become the pixel
# squares ("W · W · W" → W ▪ W ▪ W).
words = ["Web", "World", "Wide"]
tagline = "W · W · W"

subtitle = ""
[homepage.apps]
# `items` is an inline-table array on ONE line on purpose: the admin's
# toml-roundtrip writer rewrites whole `key = value` lines, so keeping
# the array single-line lets edits round-trip without losing comments.
# status: "live" (★ live), "soon" (coming soon), "lab" (in the lab).
# Empty icon = placeholder card; empty link = tile is a no-op.
items = [{ name = "FileID", status = "soon", link = "https://claude.ai/design/p/51500a82-3faf-4144-9a89-94e738dbb888?file=index.html", icon = "/assets/fileid.png" }, { name = "Document Finder", status = "live", link = "https://documentfinder.webworldwide.online/", icon = "/assets/doc-finder.png" }, { name = "Untitled", status = "lab", link = "", icon = "" }, { name = "Untitled", status = "lab", link = "", icon = "" }]

[homepage.videos]
episode = "EP. 001"
film_title = "First video — coming soon"

[homepage.socials]
order = ["youtube", "github", "twitter", "bluesky", "mastodon", "reddit", "instagram", "threads"]
hidden = []

[homepage.blog_cta]
kicker = "Latest"
title = "The Web World Wide"
title_accent = "Blog"
url = "/blog/"

description = ""